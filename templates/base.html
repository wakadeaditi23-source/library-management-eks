<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library Management System</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #f4f6fb; color: #1f2937; }
    header { background: #1e3a8a; color: #fff; padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    header h1 { margin: 0; font-size: 1.4rem; }
    header nav a { color: #fff; margin-left: 16px; text-decoration: none; font-weight: 500; }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 10px; padding: 18px; margin-bottom: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    input { padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: .95rem; }
    button { padding: 8px 14px; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; font-size: .9rem; }
    button.secondary { background: #64748b; }
    button.danger { background: #dc2626; }
    button.success { background: #16a34a; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #e5e7eb; vertical-align: middle; }
    .badge { padding: 3px 8px; border-radius: 999px; font-size: .8rem; }
    .available { background: #dcfce7; color: #166534; }
    .issued { background: #fef3c7; color: #92400e; }
    .overdue { background: #fee2e2; color: #991b1b; }
    .flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; }
    .flash.success { background: #dcfce7; }
    .flash.error { background: #fee2e2; }
    form.inline { display: inline-flex; gap: 6px; }
    footer { text-align: center; color: #64748b; font-size: .85rem; padding: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>Library Management System</h1>
    <nav>
      <a href="{{ url_for('index') }}">All Books</a>
      <a href="{{ url_for('overdue') }}">Overdue</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer>App version: {{ version }}</footer>
</body>
</html>
